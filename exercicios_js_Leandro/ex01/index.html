    <h2>Questão 8: Detector de Spoiler</h2>
    <p>Digite uma frase e verifique se ela contém a palavra “spoiler”.</p>
    <label for="inputFrase">Frase: </label>
    <input type="text" id="inputFrase">
    <button type="button" id="btn-enviar">enviar frase</button>
    <p id="saida"></p>

    <hr>

    <input type="text" id="inputCampo" placeholder="123.456.789-10">
    <button type="button" id="btn-cpf">enviar cpf</button>
    <!-- Adicionado um parágrafo para exibir o resultado na tela -->
    <p id="saida-cpf"></p>
